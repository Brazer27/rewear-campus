services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: rewear-campus:1.0.0
    container_name: rewear-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rewear-network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: postgres:17.11-alpine3.24
    container_name: rewear-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rewear_db}
      POSTGRES_USER: ${POSTGRES_USER:-rewear_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - rewear-network

  adminer:
    image: adminer:4.8.1-standalone
    container_name: rewear-adminer
    profiles:
      - tools
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rewear-network

networks:
  rewear-network:
    driver: bridge

volumes:
  postgres_data:
